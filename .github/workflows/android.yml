name: android

on:
  push:
    branches: [ main ]
    paths:
      - 'nexon_relay/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'nexon_relay/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexon_relay
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: we deliberately do NOT use android-actions/setup-android@v3.
      # As of 2026 it fails with `Failed to find package 'tools'` because the
      # action still tries to install the removed legacy `tools` package.
      # ubuntu-latest runners already ship the Android SDK pre-installed.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      # No gradle wrapper in the repo (the .jar is binary; this project was
      # authored on-device). Use the runner's Gradle directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexon_relay-debug
          path: nexon_relay/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
